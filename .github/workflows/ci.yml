name: Validate plugin

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: DanielTM999/RequestActions
          ref: '0e116fd0dbb074a19dc11805621e262f2ee60841' # RequestActions 1.0.8
          path: .deps/RequestActions
          token: ${{ secrets.RELEASE_PAT != '' && secrets.RELEASE_PAT || github.token }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.422
            10.0.301
      - uses: actions/cache@v4
        with:
          path: target/toolchain
          key: dotnet-tools-${{ runner.os }}-${{ hashFiles('src/main/java/dtm/ide/sdk/DotnetSdkService.java') }}
      - name: Install Orion API
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT != '' && secrets.RELEASE_PAT || github.token }}
        run: |
          gh release download --repo DanielTM999/OrionIde --pattern 'orion-*.jar' --pattern 'orion-*sha256.txt' --dir target/orion-dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $jar = Get-ChildItem target/orion-dist -Filter 'orion-*.jar' | Where-Object Name -NotMatch '(sources|javadoc)' | Sort-Object Name | Select-Object -Last 1
          if (-not $jar) { throw 'Orion API release artifact was not found' }
          $checksums = Get-ChildItem target/orion-dist -Filter '*sha256.txt' | Select-Object -First 1
          if ($checksums) {
            $line = Get-Content $checksums.FullName | Where-Object { $_.Contains($jar.Name) } | Select-Object -First 1
            if ($line -and $line -match '([a-fA-F0-9]{64})') {
              if ((Get-FileHash $jar.FullName -Algorithm SHA256).Hash -ne $Matches[1]) { throw 'Orion checksum mismatch' }
            }
          }
          [xml]$manifest = Get-Content pom.xml
          $apiVersion = $manifest.project.properties.'orion.api.version'
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file "-Dfile=$($jar.FullName)" '-DgroupId=dtm.ide' '-DartifactId=OrionApi' "-Dversion=$apiVersion" '-Dpackaging=jar' '-DgeneratePom=true'
          exit $LASTEXITCODE
      - name: Install RequestActions
        working-directory: .deps/RequestActions
        run: mvn -B -ntp '-DskipTests' clean install
      - name: Unit and integration tests, package
        run: |
          $dotnet = (Get-Command dotnet).Source
          $resources = Join-Path $PWD target/toolchain
          mvn -B -ntp '-Dmaven.antrun.skip=true' '-Pdotnet-integration' "-Ddotnet.path=$dotnet" "-Ddotnet.resources=$resources" verify
          exit $LASTEXITCODE
      - name: SpotBugs (high priority)
        run: mvn -B -ntp '-Dmaven.antrun.skip=true' '-Pquality' spotbugs:check
      - name: Verify permissive licenses and JAR notices
        run: |
          java --class-path target/DotnetOrionSupport-1.0.0.jar src/test/java/dtm/ide/licenses/RuntimeLicenseCheck.java --jar target/DotnetOrionSupport-1.0.0.jar --inventory target/runtime-licenses.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ runner.os }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/runtime-licenses.json
            target/spotbugsXml.xml
            target/DotnetOrionSupport-*.jar
          retention-days: 7
