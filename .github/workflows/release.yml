name: Release plugin

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release existente para atualizar. Vazio usa a ultima release; se nao existir, cria v1.0.0."
        required: false
        type: string
      orion_tag:
        description: "Tag da release do OrionIde usada como dependencia (ex: v1.0.0). Vazio usa a ultima."
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release asset
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DEP_TOKEN: ${{ secrets.RELEASE_PAT }}

    steps:
      - name: Checkout DotnetOrionSupport
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout RequestActions dependency with PAT
        if: env.DEP_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: DanielTM999/RequestActions
          path: .deps/RequestActions
          token: ${{ env.DEP_TOKEN }}

      - name: Checkout RequestActions dependency
        if: env.DEP_TOKEN == ''
        uses: actions/checkout@v6
        with:
          repository: DanielTM999/RequestActions
          path: .deps/RequestActions

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Download OrionIde release jar
        id: orion
        shell: bash
        env:
          ORION_REPO: DanielTM999/OrionIde
          ORION_TOKEN: ${{ secrets.RELEASE_PAT != '' && secrets.RELEASE_PAT || github.token }}
        run: |
          set -euo pipefail

          export GH_TOKEN="$ORION_TOKEN"

          tag="${{ github.event.inputs.orion_tag || '' }}"
          if [[ -z "$tag" ]]; then
            tag="$(gh release view --repo "$ORION_REPO" --json tagName --jq '.tagName')"
          fi

          if [[ -z "$tag" ]]; then
            echo "Nenhuma release encontrada em $ORION_REPO" >&2
            exit 1
          fi

          rm -rf orion-dist
          mkdir -p orion-dist
          gh release download "$tag" \
            --repo "$ORION_REPO" \
            --pattern 'orion-*.jar' \
            --pattern 'orion-*sha256.txt' \
            --dir orion-dist \
            --clobber

          jar="$(find orion-dist -maxdepth 1 -type f -name 'orion-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | tail -n 1)"

          if [[ -z "$jar" ]]; then
            echo "Asset orion-*.jar nao encontrado na release $tag de $ORION_REPO" >&2
            exit 1
          fi

          checksums="$(find orion-dist -maxdepth 1 -type f -name 'orion-*sha256.txt' | sort | tail -n 1)"
          if [[ -n "$checksums" ]]; then
            expected="$(grep -F "$(basename "$jar")" "$checksums" | grep -oE '[0-9a-fA-F]{64}' | head -n 1 || true)"
            if [[ -n "$expected" ]]; then
              actual="$(sha256sum "$jar" | cut -d' ' -f1)"
              if [[ "${expected,,}" != "$actual" ]]; then
                echo "Checksum divergente para $(basename "$jar"): esperado $expected, obtido $actual" >&2
                exit 1
              fi
              echo "Checksum verificado para $(basename "$jar")."
            fi
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "jar=${jar}" >> "$GITHUB_OUTPUT"

      - name: Install OrionIde jar into local Maven repository
        id: orion_install
        shell: bash
        run: |
          set -euo pipefail

          api_version="$(sed -n 's:.*<orion\.api\.version>\(.*\)</orion\.api\.version>.*:\1:p' pom.xml | head -n 1)"
          if [[ -z "$api_version" ]]; then
            echo "Propriedade orion.api.version nao encontrada no pom.xml" >&2
            exit 1
          fi

          mvn --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file \
            -Dfile="${{ steps.orion.outputs.jar }}" \
            -DgroupId=dtm.ide \
            -DartifactId=OrionApi \
            -Dversion="$api_version" \
            -Dpackaging=jar \
            -DgeneratePom=true

          echo "api_version=${api_version}" >> "$GITHUB_OUTPUT"

      - name: Configure sibling dependency checkout token
        if: env.DEP_TOKEN != ''
        shell: bash
        run: |
          git config --global url."https://x-access-token:${DEP_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install RequestActions dependency
        working-directory: .deps/RequestActions
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean install

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          requested="${{ github.event.inputs.release_tag || '' }}"
          latest="$(
            gh release list --limit 100 --json tagName \
              --jq '.[].tagName' 2>/dev/null \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
              | sed 's/^v//' \
              | sort -V \
              | tail -n 1 || true
          )"

          if [[ -n "$requested" ]]; then
            version="${requested#v}"
          elif [[ -n "$latest" ]]; then
            version="$latest"
          else
            version="1.0.0"
          fi

          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build plugin and third-party licenses
        run: mvn --batch-mode --no-transfer-progress -Dmaven.antrun.skip=true clean package

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail

          jar="$(find target -maxdepth 1 -type f -name 'DotnetOrionSupport-*.jar' ! -name 'original-*' | sort | tail -n 1)"
          if [[ -z "$jar" ]]; then
            echo "Plugin jar not found in target/" >&2
            exit 1
          fi

          mkdir -p release-assets
          cp "$jar" "release-assets/DotnetOrionSupport-${{ steps.version.outputs.version }}.jar"

          if [[ -f LICENSE ]]; then
            cp LICENSE release-assets/LICENSE.txt
          fi

          if [[ -d target/classes/licenses ]]; then
            (cd target/classes/licenses && zip -qr ../../../release-assets/licenses.zip .)
          fi

          {
            echo "jar=release-assets/DotnetOrionSupport-${{ steps.version.outputs.version }}.jar"
            echo "license=release-assets/LICENSE.txt"
            echo "licenses=release-assets/licenses.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Create release if needed
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; assets will be replaced."
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "Release gerada manualmente pelo GitHub Actions para o commit $GITHUB_SHA (OrionIde ${{ steps.orion.outputs.tag }})."
          fi

      - name: Replace release assets
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          assets=("${{ steps.assets.outputs.jar }}")

          if [[ -f "${{ steps.assets.outputs.license }}" ]]; then
            assets+=("${{ steps.assets.outputs.license }}")
          fi

          if [[ -f "${{ steps.assets.outputs.licenses }}" ]]; then
            assets+=("${{ steps.assets.outputs.licenses }}")
          fi

          gh release upload "$tag" "${assets[@]}" --clobber

      - name: Delete workflow run artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[].id' \
            | while read -r artifact_id; do
                if [[ -n "$artifact_id" ]]; then
                  gh api \
                    --method DELETE \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
                fi
              done
